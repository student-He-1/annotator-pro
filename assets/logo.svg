<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" width="720" height="170" role="img" aria-labelledby="apTitle">
  <title id="apTitle">Annotator Pro — 图像标注工具</title>

  <style>
    /* ---------------------------------------------------------------
       纯 CSS 动画（无 JavaScript）。GitHub 会剥离 SVG 中的 script 标签，
       但保留 CSS 动画，因此作为图片嵌入 README 时仍会播放。
       静态基线为「最终可见状态」：若样式被剥离，仍是一个完整的静态 logo。
       配色取自应用自身 src/app.css（--accent-blue / --accent-cyan）。

       本 logo 的核心是循环演示一次完整标注操作：
       框选 → 拖拽平移 → 抓角缩放 → 收回重来
       --------------------------------------------------------------- */

    /* 线条自绘：图片外框 */
    @keyframes drawFrame { from { stroke-dashoffset: 488; } to { stroke-dashoffset: 0; } }
    .drawFrame { stroke-dasharray: 488; animation: drawFrame .80s cubic-bezier(.65,0,.35,1) both; }

    /* 线条自绘：关键点骨架 */
    @keyframes drawBone { from { stroke-dashoffset: 15.5; } to { stroke-dashoffset: 0; } }
    .drawBone { stroke-dasharray: 15.5; animation: drawBone .40s cubic-bezier(.65,0,.35,1) both; }

    /* 线条自绘：文字外围的选区框 */
    @keyframes drawSel { from { stroke-dashoffset: 700; } to { stroke-dashoffset: 0; } }
    .drawSel { stroke-dasharray: 700; animation: drawSel .70s cubic-bezier(.65,0,.35,1) both; }

    /* 元素弹出 */
    @keyframes pop {
      from { opacity: 0; transform: scale(.35); }
      to   { opacity: 1; transform: scale(1); }
    }
    .pop {
      transform-box: fill-box;
      transform-origin: center;
      animation: pop .42s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fadeIn { animation: fadeIn .55s ease-out both; }

    /* 文字上浮 */
    @keyframes rise {
      from { opacity: 0; transform: translateY(9px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .rise { animation: rise .5s cubic-bezier(.22,1,.36,1) both; }

    /* ===== 标注框的循环演示（5s 一轮）=====
       变换原点 = 框的左上角，因此 scale 表现为「从起点向右下拖出」 */
    @keyframes boxCycle {
      0%   { transform: translate(0px, 0px)      scale(.15); opacity: 0; }
      3%   {                                                  opacity: 1; }
      22%  { transform: translate(0px, 0px)      scale(1);    }   /* 框选完成 */
      28%  { transform: translate(0px, 0px)      scale(1);    }   /* 停顿：控制点出现 */
      46%  { transform: translate(26px, 8px)     scale(1);    }   /* 拖拽平移完成 */
      52%  { transform: translate(26px, 8px)     scale(1);    }   /* 停顿 */
      74%  { transform: translate(26px, 8px)     scale(1.22); }   /* 抓右下角缩放完成 */
      88%  { transform: translate(26px, 8px)     scale(1.22); }   /* 保持 */
      96%  { transform: translate(0px, 0px)      scale(.15);  opacity: 1; }
      100% { transform: translate(0px, 0px)      scale(.15);  opacity: 0; }
    }
    .boxTrack {
      transform-box: view-box;
      transform-origin: 145px 74px;
      animation: boxCycle 5s cubic-bezier(.4,0,.2,1) 1.3s infinite normal backwards;
    }

    /* 四角控制点：框选完成才出现，收框前消失 */
    @keyframes handleCycle {
      0%, 22%   { opacity: 0; }
      27%, 90%  { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    .handles { animation: handleCycle 5s linear 1.3s infinite normal backwards; }

    /* 光标：始终贴在框的右下角，与 boxCycle 各关键帧严格对齐 */
    @keyframes cursorCycle {
      0%   { transform: translate(152.8px, 80.3px); opacity: 0; }
      3%   {                                        opacity: 1; }
      22%  { transform: translate(197px, 116px);  }
      28%  { transform: translate(197px, 116px);  }
      46%  { transform: translate(223px, 124px);  }
      52%  { transform: translate(223px, 124px);  }
      74%  { transform: translate(234.44px, 133.24px); }
      88%  { transform: translate(234.44px, 133.24px); }
      96%  { transform: translate(152.8px, 80.3px); opacity: 1; }
      100% { transform: translate(152.8px, 80.3px); opacity: 0; }
    }
    .cursor {
      transform-box: view-box;
      transform-origin: 0 0;
      animation: cursorCycle 5s cubic-bezier(.4,0,.2,1) 1.3s infinite normal backwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .drawFrame, .drawBone, .drawSel, .pop, .fadeIn, .rise,
      .boxTrack, .handles, .cursor { animation: none !important; }
      .cursor { display: none; }
    }
  </style>

  <!-- ============ 左侧：图片框 + 标注操作演示 ============ -->

  <!-- 图片内容的写意风景（低对比装饰） -->
  <g class="fadeIn" style="animation-delay:.45s" fill="#3b82f6" fill-opacity=".11">
    <circle cx="155" cy="52" r="6"/>
    <path d="M 139 132 L 175 80 L 200 108 L 222 86 L 265 132 Z"/>
  </g>

  <!-- 图片外框 -->
  <rect class="drawFrame" x="130" y="31" width="144" height="108" rx="10"
        fill="#3b82f6" fill-opacity=".05" stroke="#3b82f6" stroke-width="2"
        style="animation-delay:0s"/>

  <!-- 关键点骨架（人体姿态标注，静态装饰） -->
  <g stroke="#36d1c4" stroke-width="1.4" stroke-linecap="round" opacity=".9">
    <line class="drawBone" x1="240" y1="48" x2="232" y2="59" style="animation-delay:.70s"/>
    <line class="drawBone" x1="240" y1="48" x2="248" y2="59" style="animation-delay:.75s"/>
    <line class="drawBone" x1="232" y1="59" x2="240" y2="72" style="animation-delay:.80s"/>
    <line class="drawBone" x1="248" y1="59" x2="240" y2="72" style="animation-delay:.85s"/>
  </g>

  <!-- 关键点 -->
  <g fill="#36d1c4">
    <circle class="pop" cx="240" cy="48" r="3"   style="animation-delay:.95s"/>
    <circle class="pop" cx="232" cy="59" r="2.5" style="animation-delay:1.02s"/>
    <circle class="pop" cx="248" cy="59" r="2.5" style="animation-delay:1.09s"/>
    <circle class="pop" cx="240" cy="72" r="2.5" style="animation-delay:1.16s"/>
  </g>

  <!-- 标注框（整体随 boxCycle 平移+缩放） -->
  <g class="boxTrack">
    <rect x="145" y="74" width="52" height="42" rx="2"
          fill="#4da3ff" fill-opacity=".07" stroke="#4da3ff" stroke-width="2"/>
    <g class="handles" fill="#4da3ff">
      <rect x="142" y="71"  width="6" height="6" rx="1"/>
      <rect x="194" y="71"  width="6" height="6" rx="1"/>
      <rect x="142" y="113" width="6" height="6" rx="1"/>
      <rect x="194" y="113" width="6" height="6" rx="1"/>
    </g>
  </g>

  <!-- 光标：形状为经典指针箭头，尖端在 (0,0) -->
  <path class="cursor" d="M 0 0 L 0 16 L 4.2 12 L 6.9 17.6 L 9.6 16.4 L 6.9 10.8 L 12 10.8 Z"
        fill="#36d1c4" style="animation-delay:1.3s"/>

  <!-- ============ 右侧：字标 ============ -->

  <!-- 文字外围的选区框（对应「标注」这一动作） -->
  <rect class="drawSel" x="314" y="45" width="276" height="80" rx="8"
        fill="none" stroke="#3b82f6" stroke-width="1" opacity=".3"
        style="animation-delay:3.20s"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
     font-size="32" text-anchor="start" fill="#3b82f6">
    <text class="rise" x="327"   y="80" font-weight="700" style="animation-delay:2.20s">A</text>
    <text class="rise" x="346.2" y="80" font-weight="700" style="animation-delay:2.245s">N</text>
    <text class="rise" x="365.4" y="80" font-weight="700" style="animation-delay:2.290s">N</text>
    <text class="rise" x="384.6" y="80" font-weight="700" style="animation-delay:2.335s">O</text>
    <text class="rise" x="403.8" y="80" font-weight="700" style="animation-delay:2.380s">T</text>
    <text class="rise" x="423"   y="80" font-weight="700" style="animation-delay:2.425s">A</text>
    <text class="rise" x="442.2" y="80" font-weight="700" style="animation-delay:2.470s">T</text>
    <text class="rise" x="461.4" y="80" font-weight="700" style="animation-delay:2.515s">O</text>
    <text class="rise" x="480.6" y="80" font-weight="700" style="animation-delay:2.560s">R</text>
    <text class="rise" x="519"   y="80" font-weight="400" opacity=".72" style="animation-delay:2.605s">P</text>
    <text class="rise" x="538.2" y="80" font-weight="400" opacity=".72" style="animation-delay:2.650s">R</text>
    <text class="rise" x="557.4" y="80" font-weight="400" opacity=".72" style="animation-delay:2.695s">O</text>
  </g>

  <text class="rise" x="327" y="110"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="15" fill="#64748B" textLength="250" lengthAdjust="spacing"
        style="animation-delay:2.85s">IMAGE ANNOTATION</text>
</svg>
